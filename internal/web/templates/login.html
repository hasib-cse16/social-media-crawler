{{ define "main" }}
<div class="auth">
  <section class="panel">
    <div class="panel-body">
      <h1>Sign in</h1>
      <p class="muted small" style="margin-bottom:20px">Look up view counts for any video link.</p>

      <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        {{ with .Data.Next }}<input type="hidden" name="next" value="{{ . }}">{{ end }}

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="username"
                 autofocus value="{{ .Data.Email }}">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Sign in</button>
      </form>
    </div>
  </section>

  {{ if .Data.RegistrationOpen }}
  <p class="auth-alt">No account? <a href="/register">Create one</a>.</p>
  {{ end }}
</div>
{{ end }}
