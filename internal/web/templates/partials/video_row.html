{{- /* One dashboard row. */ -}}
{{ define "video_row" }}
<tr>
  <td class="video-cell">
    <a href="/videos/{{ .ID }}">{{ .Title }}</a>
    {{ with .Caption }}<div class="video-caption">{{ . }}</div>{{ end }}
  </td>
  <td><span class="pill pill-{{ lower (printf "%s" .Platform) }}">{{ .PlatformName }}</span></td>
  <td class="num" title="{{ .ViewsExact }} views">{{ .Views }}</td>
  <td class="num {{ .GainedClass }}"
      {{ with .BaselineAt }}title="Compared with the reading taken {{ ago . }}"{{ else }}title="No earlier reading to compare with yet"{{ end }}>
    {{ .Gained }}
  </td>
  <td>{{ .Sparkline }}</td>
  <td>
    <span class="status status-{{ .Tone }}">{{ .Status }}</span>
    <div class="video-caption" {{ with .LastReadAt }}title="{{ timestamp . }}"{{ end }}>Read {{ .LastRead }}</div>
  </td>
</tr>
{{ end }}
