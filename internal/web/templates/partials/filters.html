{{- /* The list controls. A plain GET form, so it works without scripting and
       every view has a shareable URL. */ -}}
{{ define "filters" }}
<form class="filters" method="get" action="/" data-autosubmit>
  <div class="filter-group">
    <label for="sort">Sort</label>
    <select id="sort" name="sort">
      {{ range .Sorts }}<option value="{{ .Value }}"{{ if .Selected }} selected{{ end }}>{{ .Label }}</option>{{ end }}
    </select>
  </div>
  <div class="filter-group">
    <label for="window">Growth over</label>
    <select id="window" name="window">
      {{ range .Windows }}<option value="{{ .Value }}"{{ if .Selected }} selected{{ end }}>{{ .Label }}</option>{{ end }}
    </select>
  </div>
  <div class="filter-group">
    <label for="platform">Platform</label>
    <select id="platform" name="platform">
      <option value="">All</option>
      {{ range .PlatformOptions }}<option value="{{ .Value }}"{{ if .Selected }} selected{{ end }}>{{ .Label }}</option>{{ end }}
    </select>
  </div>
  <button type="submit" class="btn btn-sm" data-nojs>Apply</button>
</form>
{{ end }}
